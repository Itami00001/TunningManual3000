<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="TuningManual3000 - Интерактивный конструктор тюнинга автомобилей. Выбирайте детали и создавайте свою dream build.">

    <title>TuningManual3000 - Конструктор Тюнинга</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="container header__inner">
                <a href="/" class="logo">
                    <span class="logo__icon">🏎️</span>
                    <span class="logo__text">Tuning<span>Manual</span>3000</span>
                </a>

                <nav class="nav">
                    <a href="/" class="nav__link nav__link--active">Каталог</a>
                    <a href="/admin.html" class="nav__link">Админка</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Hero Section -->
            <section class="hero container">
                <h1 class="hero__title">Создай свой <span>Dream Build</span></h1>
                <p class="hero__subtitle">
                    Выбери автомобиль, подбери детали и собери машину своей мечты.
                    Все запчасти можно найти на маркетплейсах.
                </p>
            </section>

            <!-- Cars Grid -->
            <section class="cars-section container">
                <div class="section-header">
                    <h2 class="section-header__title">Выбери автомобиль</h2>
                    <p class="section-header__subtitle">Автомобили для тюнинга</p>
                </div>

                <div id="cars-grid" class="cars-grid">
                    <!-- Cars will be loaded here dynamically -->
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <p class="footer__text">
                    © 2026 TuningManual3000.
                </p>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/main.js"></script>
</body>

</html>
